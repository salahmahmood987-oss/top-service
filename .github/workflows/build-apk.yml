name: Build APK

# يشتغل تلقائياً مع كل push على main/master، أو يدوياً من تبويب Actions
# (Run workflow). النتيجة: ملف app-debug.apk جاهز للتحميل من صفحة الـ run.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 يتطلب Node >= 22 (مع Node 20 يفشل cap sync بخطأ fatal)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 يتطلب JDK 21 (مع JDK 17 يفشل التجميع بخطأ invalid source release: 21)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # sdkmanager مش على PATH في جهاز GitHub رغم إن ANDROID_HOME موجود،
      # فنضيف مسار cmdline-tools للـ PATH أولاً.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager --version

      - name: Install Android platform and build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # gradlew اترفع على GitHub بدون صلاحية تنفيذ (كل الملفات اترفعت 644)،
      # فندي له صلاحية التنفيذ قبل البناء.
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: top-service-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
